name: Hosted Harbor eval

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      release:
        description: Full staging commit SHA
        required: true
        type: string
      suite:
        description: Flight tool mode
        type: choice
        options: [smoke, live-smoke]
        default: smoke
      codex_provider:
        description: Inference provider for the Codex control
        type: choice
        options: [openrouter, openai]
        default: openrouter
      codex_model:
        description: Explicit openai/ model when using the OpenAI gateway
        required: false
        type: string

permissions:
  contents: read

jobs:
  eval:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the staging release
        shell: bash
        env:
          REQUESTED_RELEASE: ${{ inputs.release || github.event.deployment.sha }}
        run: |
          if [[ ! "$REQUESTED_RELEASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Provide the full staging commit SHA.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED_RELEASE" HEAD; then
            echo 'The staging release must be on the default branch.' >&2
            exit 1
          fi
          git checkout --detach "$REQUESTED_RELEASE"
          echo "AGENT_RELEASE=$REQUESTED_RELEASE" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Launch and grade
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          CODEX_OPENROUTER_API_KEY: ${{ secrets.CODEX_OPENROUTER_API_KEY }}
          CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
          CODEX_PROVIDER: ${{ inputs.codex_provider || vars.CODEX_PROVIDER || 'openrouter' }}
          CODEX_MODEL: ${{ inputs.codex_model || vars.CODEX_MODEL }}
          EVAL_SUITE: ${{ inputs.suite || 'smoke' }}
          EVAL_TARGET: ${{ inputs.suite == 'live-smoke' && 'remote' || 'both' }}
        run: >-
          uv run --locked python -m scripts.run_eval
          --release "$AGENT_RELEASE" --suite "$EVAL_SUITE" --target "$EVAL_TARGET"
          --codex-provider "$CODEX_PROVIDER"
