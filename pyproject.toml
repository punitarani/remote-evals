[project]
name = "remote-evals"
version = "0.1.0"
description = "Evaluate a deployed flight agent in a Harbor trial"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "flights[mcp]==0.9.0",
    "httpx",
    "uvicorn",
]

[dependency-groups]
dev = ["harbor==0.25.0", "pytest", "ruff"]
fixture = ["flights[mcp]==0.9.0", "time-machine==3.6.0"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
